stages:
  - test
  - build
  - deploy

variables:
  IMAGE_NAME: registry.gitlab.com/username/project

test:
  stage: test
  image: python:3.11
  script:
    - pip install -r requirements.txt
    - pytest

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHA .
    - docker push $IMAGE_NAME:$CI_COMMIT_SHA

deploy:
  stage: deploy
  script:
    - echo "Deploy to staging"
  only:
    - main
